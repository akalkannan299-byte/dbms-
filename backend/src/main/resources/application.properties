spring.application.name=noirbite
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/noirbite_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.tax-rate=${TAX_RATE:0.05}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.admin-key=${ADMIN_API_KEY:}
